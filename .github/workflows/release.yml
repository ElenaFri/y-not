name: Release

on:
    push:
        tags:
            - "v[0-9]*.[0-9]*.[0-9]*" # glob filter; exact SemVer validated in the job

permissions:
    contents: write

jobs:
    deb:
        runs-on: ubuntu-latest
        container:
            image: debian:trixie-slim
        steps:
            - name: Validate version tag
              run: |
                  if ! printf '%s\n' "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
                      echo "Refusing non-version tag: ${GITHUB_REF_NAME}" >&2
                      exit 1
                  fi

            - name: Install build dependencies
              run: |
                  apt-get update
                  apt-get install -y --no-install-recommends \
                      build-essential libacl1-dev libcap-dev libselinux1-dev \
                      ca-certificates git curl gpg dpkg-dev

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Build .deb package
              run: make deb

            - name: Prepare release notes
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  awk -v version="$version" '
                      index($0, "## v" version " ") == 1 { found=1; in_release=1; next }
                      in_release && /^## / { exit }
                      in_release { print }
                      END { if (!found) exit 1 }
                  ' CHANGELOG.md > build/release-notes.md
                  test -s build/release-notes.md

            - name: Install GitHub CLI
              run: |
                  curl --proto '=https' --tlsv1.2 -fsSL \
                      https://cli.github.com/packages/githubcli-archive-keyring.gpg \
                      -o /usr/share/keyrings/githubcli-archive-keyring.gpg
                  echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
                      > /etc/apt/sources.list.d/github-cli.list
                  apt-get update
                  apt-get install -y gh

            - name: Publish package and changelog notes
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
                      gh release upload "${GITHUB_REF_NAME}" build/*.deb --clobber \
                          --repo "${GITHUB_REPOSITORY}"
                      gh release edit "${GITHUB_REF_NAME}" \
                          --title "${GITHUB_REF_NAME}" \
                          --notes-file build/release-notes.md \
                          --repo "${GITHUB_REPOSITORY}"
                  else
                      gh release create "${GITHUB_REF_NAME}" build/*.deb \
                          --repo "${GITHUB_REPOSITORY}" \
                          --title "${GITHUB_REF_NAME}" \
                          --notes-file build/release-notes.md
                  fi
