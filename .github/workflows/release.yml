name: Release

on:
    push:
        tags:
            - "v*.0.0" # major versions only (v1.0.0, v2.0.0, ...)

permissions:
    contents: write

jobs:
    deb:
        runs-on: ubuntu-latest
        container:
            image: debian:trixie-slim
        steps:
            - name: Install build dependencies
              run: |
                  apt-get update
                  apt-get install -y --no-install-recommends \
                      build-essential libacl1-dev libcap-dev libselinux1-dev \
                      ca-certificates git curl gpg dpkg-dev

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Build .deb package
              run: make deb

            - name: Install GitHub CLI
              run: |
                  curl --proto '=https' --tlsv1.2 -fsSL \
                      https://cli.github.com/packages/githubcli-archive-keyring.gpg \
                      -o /usr/share/keyrings/githubcli-archive-keyring.gpg
                  echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
                      > /etc/apt/sources.list.d/github-cli.list
                  apt-get update
                  apt-get install -y gh

            - name: Upload .deb to the GitHub release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release upload "${GITHUB_REF_NAME}" build/*.deb --clobber \
                      --repo "${GITHUB_REPOSITORY}" || \
                  gh release create "${GITHUB_REF_NAME}" build/*.deb \
                      --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
